# 100M KDA-MoE model (was the dense control; all models now use KDA + MoE)

[architecture]
n_layers = 16
d_model = 640
n_heads = 10
n_kv_heads = 5
head_dim = 64
vocab_size = 32000
ffn_multiplier = 3.0

[kda]
use_kda = true

[moe]
use_moe = true
n_experts = 32
top_k = 2
latent_dim = 256
expert_hidden = 216
shared_expert_hidden = 512

global_attn_layers = [3, 7, 11, 15]

[training]
seq_len = 2048
curriculum_start_seq = 512
curriculum_milestones = [[2000, 1024], [5000, 2048]]
lr = 0.00015
betas = [0.9, 0.95]
weight_decay = 0.1
warmup_steps = 2000
total_steps = 10000
clip_grad_norm = 1.0
optimizer = "adamw"
bf16 = true
tf32 = true
gradient_checkpointing = true
compile_model = false
ema = false
ema_decay = 0.999
micro_batch_size = 1
grad_accum_steps = 16
checkpoint_interval = 500
full_checkpoint_interval = 2000
log_interval = 10
