# KDA-MoE 180M — scaling-law variant (plan.md scaling-law configs)
# 32 experts / top-3 / 11 MoE layers + dense warmup

[architecture]
n_layers = 12
d_model = 512
n_heads = 8
n_kv_heads = 4
head_dim = 64
vocab_size = 32000

[kda]
use_kda = true
kda_kernel_size = 4
kda_chunk_size = 64
kda_g_min = -5.0
kda_use_fla = true

[moe]
use_moe = true
n_experts = 32
top_k = 3
latent_dim = 256
expert_hidden = 1024
shared_expert_hidden = 1024
aux_free_bias_update = 0.001
z_loss_coeff = 0.0001

global_attn_layers = [3, 7, 11]

[training]
seq_len = 512
curriculum_start_seq = 512
curriculum_milestones = []
lr = 0.0003
betas = [0.9, 0.95]
weight_decay = 0.1
warmup_steps = 20
total_steps = 500
clip_grad_norm = 1.0
optimizer = "adamw"
bf16 = true
tf32 = true
gradient_checkpointing = false
compile_model = false
ema = false
ema_decay = 0.999
micro_batch_size = 1
grad_accum_steps = 4
checkpoint_interval = 100
full_checkpoint_interval = 2000
log_interval = 10
