# KDA-MoE 80M — scaling-law variant (plan.md scaling-law configs)

[architecture]
n_layers = 8
d_model = 384
n_heads = 6
n_kv_heads = 1
head_dim = 64
vocab_size = 32000

[kda]
use_kda = true
kda_kernel_size = 4
kda_chunk_size = 64
kda_g_min = -5.0
kda_use_fla = false

[moe]
use_moe = true
n_experts = 16
top_k = 2
latent_dim = 192
expert_hidden = 384
shared_expert_hidden = 384
aux_free_bias_update = 0.001
z_loss_coeff = 0.0

global_attn_layers = [3, 7]

[training]
seq_len = 512
curriculum_start_seq = 512
curriculum_milestones = []
lr = 0.0003
weight_decay = 0.1
warmup_steps = 20
total_steps = 500
micro_batch_size = 1
grad_accum_steps = 4
clip_grad_norm = 1.0
use_8bit_adam = true
checkpoint_interval = 100
full_checkpoint_interval = 2000
log_interval = 10

[data.data_mix]
dclm = 0.45
fineweb = 0.20
code = 0.20
math = 0.10
tinystories = 0.03
markdown = 0.02

[data.data_caps_gb]
dclm = 2.5
fineweb = 2.0
code = 2.5
math = 1.0
tinystories = 0.5
markdown = 0.5
