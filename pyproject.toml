[project]
name = "kda-moe"
version = "0.1.0"
description = "KDA-MoE: sparse mixture-of-experts language model with Kolmogorov-Dirac Attention"
readme = "README.md"
authors = [
    { name = "Aabish Malik", email = "aabishmalik3337@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.0",
    "einops>=0.8.2",
    "numpy>=2.5.1",
    "safetensors>=0.8.0",
    "tensorboard>=2.21.0",
    "tokenizers>=0.22.2",
    "tomli-w>=1.2.0",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.14.1",
]

[project.scripts]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
